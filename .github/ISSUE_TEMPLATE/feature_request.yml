name: Feature request
description: Suggest an improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What reading workflow should be improved?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Privacy
      options:
        - label: This can work without sending documents to a backend.
          required: true
