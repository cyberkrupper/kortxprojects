name: WhatsApp Local AI CI

on:
  push:
    branches: [main]
    paths:
      - whatsapp-llm-extension/**
      - .github/workflows/whatsapp-llm-extension-ci.yml
  pull_request:
    paths:
      - whatsapp-llm-extension/**
      - .github/workflows/whatsapp-llm-extension-ci.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-llm-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
